name: Question or idea
description: Ask or suggest anything. No structure required.
title: "[q] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: >-
        Worth knowing: `SPEC.md` records *why* for most decisions — "why not X"
        is often already answered. Feature ideas are read with interest but the
        roadmap is the spec.

  - type: textarea
    id: body
    attributes:
      label: What's on your mind
    validations:
      required: true
