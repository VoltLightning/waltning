packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"

# esbuild's postinstall links its platform binary; drizzle-kit and tsx both
# need it. Denying this leaves them broken at runtime, not at install time.
allowBuilds:
  # `packages/ledger`'s test driver, and a **devDependency only** — it never
  # reaches the Pi or the phone, both of which run their own SQLite.
  #
  # It is here because the property those tests check is **atomicity**: a local
  # write puts a row in the ledger and an entry in the outbox, or does neither
  # (§14.1). `drizzle-orm/sqlite-proxy` was the zero-dependency alternative and
  # is wrong for exactly that reason — it has no transaction support, so a test
  # written against it would report success on a write path that commits in two
  # pieces, which is the bug.
  #
  # `node:sqlite` ships with Node 24 and needs no build at all, but drizzle has
  # no driver for it in 0.45; adapting it to the better-sqlite3 driver's surface
  # would mean maintaining a shim whose divergence would show up as a passing
  # test rather than a failing one.
  better-sqlite3: true
  esbuild: true

patchedDependencies:
  # Drizzle 0.45.2's Expo driver never finalizes the SQLite statements it
  # prepares. The retained locks make the first local write fail at `commit` on
  # Android; upstream issue drizzle-team/drizzle-orm#4519 remains open. The
  # patch drives every query to completion, finalizes one-shot queries in
  # `finally`, and leaves explicit prepared queries reusable. Remove it when an
  # installed stable release does that itself and
  # `tests/dependency-patches.test.ts` has been updated first.
  drizzle-orm@0.45.2: patches/drizzle-orm@0.45.2.patch
  # expo-sqlite's web worker channel writes the result length with a typed-array
  # `set`, which copies *elements*, not bytes — the length arrives as
  # `length & 0xFF` and every synchronous result over 255 bytes is truncated
  # (two outbox rows is enough). Still present on upstream `main`; the patch
  # is one `DataView.setUint32`. `tests/dependency-patches.test.ts` pins it.
  expo-sqlite@57.0.1: patches/expo-sqlite@57.0.1.patch

# Expo supports pnpm's isolated installs from SDK 54 onward, and Metro
# auto-configures for monorepos from SDK 52. `apps/mobile/metro.config.js`
# exists for the browser's SQLite alone (wasm assets, cross-origin isolation,
# the worker route) — never for resolution. If a native build ever fails to
# resolve, switch to:
#   nodeLinker: hoisted
# and re-run `npx expo start --clear`.

# Keep a single React / React Native across the workspace. Duplicates are the
# most common source of "invalid hook call" and native build failures in RN
# monorepos, and they surface late.
publicHoistPattern:
  - "*react*"
  - "*react-native*"
