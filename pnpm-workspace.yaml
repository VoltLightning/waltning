packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"

# esbuild's postinstall links its platform binary; drizzle-kit and tsx both
# need it. Denying this leaves them broken at runtime, not at install time.
allowBuilds:
  # `packages/ledger`'s test driver, and a **devDependency only** — it never
  # reaches the Pi or the phone, both of which run their own SQLite.
  #
  # It is here because the property those tests check is **atomicity**: a local
  # write puts a row in the ledger and an entry in the outbox, or does neither
  # (§14.1). `drizzle-orm/sqlite-proxy` was the zero-dependency alternative and
  # is wrong for exactly that reason — it has no transaction support, so a test
  # written against it would report success on a write path that commits in two
  # pieces, which is the bug.
  #
  # `node:sqlite` ships with Node 24 and needs no build at all, but drizzle has
  # no driver for it in 0.45; adapting it to the better-sqlite3 driver's surface
  # would mean maintaining a shim whose divergence would show up as a passing
  # test rather than a failing one.
  better-sqlite3: true
  esbuild: true

patchedDependencies:
  # Drizzle 0.45.2's Expo driver never finalizes the SQLite statements it
  # prepares. The retained locks make the first local write fail at `commit` on
  # Android; upstream issue drizzle-team/drizzle-orm#4519 remains open. The
  # patch drives every query to completion, finalizes one-shot queries in
  # `finally`, and leaves explicit prepared queries reusable. Remove it when an
  # installed stable release does that itself and
  # `tests/dependency-patches.test.ts` has been updated first.
  drizzle-orm@0.45.2: patches/drizzle-orm@0.45.2.patch
  # Four browser defects, all still present on upstream `main`, all pinned by
  # `tests/dependency-patches.test.ts` — three of them with deterministic Node
  # reproductions driving the installed files, one (`web/worker.ts`, which
  # imports the wasm binary and so cannot be loaded under Node) by patch text.
  #
  # 1. `web/WorkerChannel.ts` writes the result length with a typed-array
  #    `set`, which copies *elements*, not bytes — the length arrives as
  #    `length & 0xFF` and every synchronous result over 255 bytes is
  #    truncated (two outbox rows is enough). One `DataView.setUint32`, and
  #    the read beside it made little-endian to match.
  # 2. The same file serialises a worker failure as `JSON.stringify({ error })`,
  #    and an `Error` has no own enumerable properties — so every synchronous
  #    failure in the browser reaches the app as the message `[object Object]`.
  #    The patch sends `{ name, message, stack, code }` and rebuilds the error
  #    on the far side, on both the synchronous and the `postMessage` channel.
  #    The asynchronous branch is keyed on the error rather than on a truthy
  #    result, because most worker operations return nothing at all and `false`
  #    and `null` are ordinary results — posting a described error down that
  #    branch turns every successful call into a rejection.
  # 3. A failed OPFS pool acquisition is otherwise permanent for the life of
  #    the page: `web/worker.ts` assigns `_sqlite3` before the VFS that can
  #    throw, so every later call falls through to `Invalid VFS state`, and
  #    `wa-sqlite/AccessHandlePoolVFS.js` acquires with `Promise.all`, which
  #    leaves the handles it *did* win open inside an unreachable instance. A
  #    page that lost the race to the document it replaced could not recover
  #    without a reload. The patch publishes the VFS trio only once all three
  #    exist, releases the pool if anything after the acquisition throws, and
  #    releases a partial acquisition inside the VFS itself.
  # 4. The pool holds six files and grows only on a virgin directory, while
  #    this app's own peak is six (`apps/mobile/src/phone-ledger.web.ts` carries
  #    the arithmetic) — so the next new file is `SQLITE_CANTOPEN` forever and
  #    the install is bricked. The patch raises the capacity to sixteen and
  #    tops up a directory created under a smaller one.
  expo-sqlite@57.0.1: patches/expo-sqlite@57.0.1.patch

# Expo supports pnpm's isolated installs from SDK 54 onward, and Metro
# auto-configures for monorepos from SDK 52. `apps/mobile/metro.config.js`
# exists for the browser's SQLite alone (wasm assets, cross-origin isolation,
# the worker route) — never for resolution. If a native build ever fails to
# resolve, switch to:
#   nodeLinker: hoisted
# and re-run `npx expo start --clear`.

# Keep a single React / React Native across the workspace. Duplicates are the
# most common source of "invalid hook call" and native build failures in RN
# monorepos, and they surface late.
publicHoistPattern:
  - "*react*"
  - "*react-native*"
