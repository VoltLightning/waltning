services:
  postgres:
    image: postgres:16-alpine
    container_name: waltning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waltning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-waltning}
      # Deterministic collation — keeps ORDER BY stable across host locales.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    # Loopback only. Remote access goes through Tailscale, never a published port.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waltning} -d ${POSTGRES_DB:-waltning}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
